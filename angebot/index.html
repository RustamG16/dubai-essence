<!doctype html>
<html lang="de" data-page="offer">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>Angebot – Dubai Essence × Convenium.Design</title>
  <!-- critical: paint nothing until the module stylesheet has applied (prevents the unstyled-first-paint layout shift) -->
  <style>html{background:#0d0a0a}body{color:#f1e9dc;background:#0d0a0a;margin:0}body:not(.css-ready){opacity:0}</style>
  <script type="module" crossorigin src="/dubai-essence/assets/angebot-Dfy-TCJ1.js"></script>
  <link rel="modulepreload" crossorigin href="/dubai-essence/assets/motion-BccWvbzm.js">
  <link rel="stylesheet" crossorigin href="/dubai-essence/assets/motion-d3YcCuOv.css">
  <link rel="stylesheet" crossorigin href="/dubai-essence/assets/angebot-BOF2WZP-.css">
</head>
<body>
  <a class="o-skip link" href="#konfigurator">Zum Konfigurator springen</a>

  <!-- O-H header, sticky 72 -->
  <header class="o-head">
    <span class="o-head__studio">Convenium.Design</span>
    <div class="o-head__meta">
      <span data-slot="header-meta"></span>
      <a class="link o-head__landing" data-href="landing" href="../">Landing ansehen<svg class="o-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 8.5l5-5M4.5 3.5h4v4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></a>
    </div>
  </header>

  <main id="offer">
    <!-- O-1 hero -->
    <section class="o-hero" aria-labelledby="o-hero-title">
      <div class="o-hero__main">
        <p class="o-eyebrow t-micro tone-gold" data-copy="heroEyebrow"></p>
        <h1 class="o-hero__title t-offer-h1" id="o-hero-title" data-slot="hero-title"></h1>
        <p class="o-hero__b2b tone-80" data-copy="b2bNote"></p>
        <p class="o-hero__sub t-lead tone-80" data-copy="heroSub"></p>
        <p class="o-hero__note t-small tone-64" data-slot="link-note" hidden></p>
      </div>
      <div class="o-hero__side">
        <p class="o-countdown" data-slot="countdown" aria-live="off"></p>
        <p class="o-countdown__caption t-small tone-64" data-slot="countdown-caption"></p>
        <div class="o-slots" data-slot="slots">
          <div class="o-slots__meter" data-slot="slot-meter" aria-hidden="true"></div>
          <p class="t-ui" data-slot="slots-line"></p>
        </div>
        <a class="o-still" data-href="landing" href="../">
          <span class="o-still__frame"><img class="o-still__img" src="../media/v2/scene/catalog-1920.webp" width="1920" height="1080" alt="" data-copy-alt="stillAlt" decoding="async" /></span>
          <span class="o-still__caption t-small"><span class="link" data-copy="stillCaption"></span></span>
        </a>
      </div>
    </section>

    <!-- O-2 Warum jetzt -->
    <section class="o-section o-why" aria-labelledby="o-why-title">
      <h2 class="t-offer-h2" id="o-why-title" data-copy="whyNowHeading"></h2>
      <div class="o-why__grid">
        <article class="o-why__item">
          <blockquote class="t-quote" data-copy="whyNow1Quote"></blockquote>
          <p class="t-note" data-copy="whyNow1Source"></p>
          <p class="t-micro tone-gold o-why__label" data-copy="whyNowAnswerLabel"></p>
          <p class="t-body" data-copy="whyNow1Text"></p>
        </article>
        <article class="o-why__item">
          <blockquote class="t-quote" data-copy="whyNow2Quote"></blockquote>
          <p class="t-note" data-copy="whyNow2Source"></p>
          <p class="t-micro tone-gold o-why__label" data-copy="whyNowAnswerLabel"></p>
          <p class="t-body" data-copy="whyNow2Text"></p>
        </article>
      </div>
    </section>

    <!-- O-3 Pakete -->
    <section class="o-section o-packages" id="pakete" aria-labelledby="o-packages-title">
      <h2 class="t-offer-h2" id="o-packages-title" data-copy="headingPackages"></h2>
      <div class="o-packages__grid" data-slot="packages"></div>
      <div class="o-pkgpager" data-slot="pkg-pager"></div>
      <p class="o-packages__regular t-small tone-64" data-slot="regular-note"></p>
    </section>

    <!-- O-4 Konfigurator (+ marketing block) with the sticky summary -->
    <section class="o-section o-config" id="konfigurator" aria-labelledby="o-config-title">
      <h2 class="t-offer-h2" id="o-config-title" data-copy="headingLines"></h2>
      <div class="o-config__grid">
        <div class="o-config__main">
          <div class="o-pkgswitch" role="radiogroup" aria-label="Paket" data-slot="pkg-switch"></div>
          <div data-slot="config-groups"></div>
          <div class="o-marketing" aria-labelledby="o-marketing-title">
            <div class="o-marketing__head">
              <h3 class="o-group__title" id="o-marketing-title" data-copy="headingMarketing"></h3>
              <span class="t-note">monatlich, nicht rabattiert</span>
            </div>
            <div class="o-marketing__grid" data-slot="marketing"></div>
          </div>
        </div>
        <aside class="o-summary" id="o-summary" aria-label="Zusammenfassung">
          <div class="o-summary__bar">
            <button type="button" class="o-summary__toggle" aria-expanded="false" aria-controls="o-summary-body">
              <span class="o-summary__barlabel t-micro tone-gold"><span data-copy="oneTimeTotal"></span><svg class="o-summary__chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5l3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="o-summary__bartotal t-num-xs" data-slot="bar-total"></span>
              <span class="visually-hidden" data-copy="summaryToggle"></span>
            </button>
            <a class="btn btn--primary o-summary__barcta" data-cta="mail" href="#"><span data-copy="ctaMail"></span></a>
          </div>
          <div class="o-summary__body" id="o-summary-body" tabindex="-1" data-lenis-prevent>
          <p class="t-micro tone-gold" data-slot="sum-package"></p>
          <div class="o-summary__totals" aria-live="polite" aria-atomic="false">
            <div class="o-summary__block">
              <p class="o-summary__label t-small tone-80" data-copy="oneTimeTotal"></p>
              <p><span class="t-num-m pulse" data-slot="sum-one"></span> <span class="t-struck o-summary__struck" data-slot="sum-one-list"></span></p>
            </div>
            <div class="o-summary__block">
              <p class="o-summary__label t-small tone-80" data-copy="monthlyTotal"></p>
              <p><span class="t-num-s pulse" data-slot="sum-monthly"></span><span class="t-small tone-64" data-slot="sum-monthly-ext"></span></p>
            </div>
            <div class="o-summary__block" data-slot="sum-savings-block">
              <p class="o-summary__label t-small tone-80">Ersparnis</p>
              <p><span class="t-num-xs tone-gold pulse" data-slot="sum-savings"></span> <span class="t-note">gegenüber Listenpreis</span></p>
            </div>
            <div class="o-summary__block" data-slot="sum-share-block" hidden>
              <p class="o-summary__label t-small tone-80" data-slot="sum-share-label"></p>
              <p><span class="t-num-xs pulse" data-slot="sum-share"></span> <span class="t-note">Anzahlung</span></p>
            </div>
          </div>
          <p class="t-note o-summary__band" data-slot="sum-band"></p>
          <div class="o-cta-stack">
            <a class="btn btn--primary" data-cta="mail" href="#"><span data-copy="ctaMail"></span></a>
            <a class="btn btn--outline" data-cta="wa" href="#" target="_blank" rel="noopener" hidden><span data-copy="ctaWhatsapp"></span></a>
          </div>
          <div class="o-copylinks t-small">
            <button type="button" class="link" data-action="copy-config">Konfiguration kopieren</button>
            <button type="button" class="link" data-action="copy-link">Link zu dieser Konfiguration</button>
          </div>
          <p class="t-note o-copystatus" data-slot="copy-status" aria-live="polite"></p>
          <textarea class="o-copyfallback" data-slot="copy-fallback" readonly rows="4" aria-label="Text zum Kopieren" hidden></textarea>
          </div>
        </aside>
        <div class="o-summary__scrim" data-slot="summary-scrim" hidden></div>
      </div>
    </section>

    <!-- O-5 Zahlungsweise: Festpreis | Umsatzbeteiligung -->
    <section class="o-section o-share" id="beteiligung" aria-labelledby="o-share-title">
      <h2 class="t-offer-h2" id="o-share-title" data-copy="headingShare"></h2>
      <div class="o-tabs">
        <div class="o-tabs__list" role="tablist" aria-label="Zahlungsweise">
          <button type="button" role="tab" id="tab-fixed" aria-controls="panel-fixed" class="o-tab">Festpreis</button>
          <button type="button" role="tab" id="tab-share" aria-controls="panel-share" class="o-tab">Umsatzbeteiligung</button>
        </div>
        <p class="t-note" data-slot="tab-note" hidden></p>
      </div>

      <div class="o-panel" role="tabpanel" id="panel-fixed" aria-labelledby="tab-fixed" tabindex="0">
        <p class="t-lead" data-slot="fixed-text"></p>
        <p class="t-body tone-80" data-slot="fixed-teaser"></p>
      </div>

      <div class="o-panel o-share__panel" role="tabpanel" id="panel-share" aria-labelledby="tab-share" tabindex="0" hidden>
        <div class="o-share__controls">
          <p class="t-body o-share__lead" data-slot="share-lead"></p>
          <p class="t-small tone-64 o-share__explainer" data-copy="shareExplainer"></p>

          <div class="o-field">
            <div class="o-field__row">
              <label class="t-ui" for="share-slider">Anteil am Online-Umsatz</label>
              <output class="o-bubble" for="share-slider" data-slot="share-bubble"></output>
            </div>
            <input class="o-range" id="share-slider" type="range" />
            <div class="o-range__ticks t-note" data-slot="share-ticks" aria-hidden="true"></div>
          </div>

          <div class="o-field">
            <label class="t-ui" for="share-revenue" data-copy="shareRevenueLabel"></label>
            <div class="o-revenue">
              <button type="button" class="o-stepper" data-step="-1" aria-label="Umsatz verringern"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <input class="o-revenue__input" id="share-revenue" type="number" inputmode="numeric" aria-describedby="share-revenue-hint share-revenue-error" />
              <button type="button" class="o-stepper" data-step="1" aria-label="Umsatz erhöhen"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6 2v8" stroke="currentColor" stroke-width="1.4"/></svg></button>
              <span class="t-small tone-64">€ / Monat</span>
            </div>
            <p class="t-note" id="share-revenue-error" data-slot="share-revenue-error" role="status"></p>
            <p class="t-small tone-64" id="share-revenue-hint" data-slot="share-revenue-hint"></p>
          </div>

          <div class="o-share__out" aria-live="polite">
            <p class="t-micro tone-gold">Anzahlung</p>
            <p class="o-share__big"><span class="t-num-xl pulse" data-slot="share-upfront"></span> <span class="t-num-xs tone-64" data-slot="share-instead"></span></p>
            <div class="o-share__tier2">
              <div>
                <p class="t-small tone-80">Effektiv gesamt</p>
                <p class="t-num-m pulse" data-slot="share-effective"></p>
              </div>
              <div>
                <p class="t-small tone-80">gegenüber Festpreis</p>
                <p class="t-num-m pulse" data-slot="share-delta"></p>
              </div>
            </div>
            <dl class="o-share__rows">
              <div><dt>Anzahlung sinkt um</dt><dd data-slot="row-reduction"></dd></div>
              <div><dt data-slot="row-expected-label"></dt><dd data-slot="row-expected"></dd></div>
              <div><dt data-slot="row-cap-label"></dt><dd data-slot="row-cap"></dd></div>
              <div><dt>Break-even-Umsatz</dt><dd data-slot="row-breakeven"></dd></div>
            </dl>
          </div>
          <p class="t-body o-honesty" data-slot="share-honesty"></p>
          <p class="t-small tone-64" data-slot="share-perpoint"></p>
        </div>

        <figure class="o-chart">
          <figcaption class="o-chart__head">
            <span class="t-ui">Kosten und Rohertrag über die Laufzeit</span>
            <ul class="o-legend t-note" role="list">
              <li><svg viewBox="0 0 24 8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" class="k-fixed"/></svg>Kosten Festpreis</li>
              <li><svg viewBox="0 0 24 8" aria-hidden="true"><line x1="0" y1="4" x2="24" y2="4" class="k-share"/></svg>Kosten Beteiligung</li>
              <li><svg viewBox="0 0 24 8" aria-hidden="true"><rect x="0" y="0" width="24" height="8" class="k-area"/><line x1="0" y1="1" x2="24" y2="1" class="k-rev"/></svg>Rohertrag Online</li>
            </ul>
          </figcaption>
          <div class="o-chart__plot" data-slot="chart"></div>
          <p class="t-note" data-copy="chartNote"></p>
        </figure>

        <div class="o-conditions">
          <h4 class="t-micro tone-gold" data-copy="headingConditions"></h4>
          <ul class="o-conditions__list t-small tone-80" role="list" data-slot="conditions"></ul>
        </div>
      </div>
    </section>

    <!-- O-7 Monatliche Kosten -->
    <section class="o-section o-monthly" aria-labelledby="o-monthly-title">
      <h2 class="t-offer-h2" id="o-monthly-title" data-copy="headingMonthly"></h2>
      <div class="o-scroll" data-slot="table-scroll" role="region" tabindex="0" data-copy-label="tableScrollLabel">
      <table class="o-table t-row">
        <thead><tr><th scope="col">Posten</th><th scope="col">an wen</th><th scope="col" class="num-col">monatlich</th><th scope="col" class="num-col">jährlich</th></tr></thead>
        <tbody data-slot="monthly-rows"></tbody>
        <tfoot data-slot="monthly-total"></tfoot>
      </table>
      </div>
      <p class="o-scroll__hint t-note" data-copy="tableScrollHint"></p>
    </section>

    <!-- O-8 Zeitplan -->
    <section class="o-section o-timeline" aria-labelledby="o-timeline-title">
      <h2 class="t-offer-h2" id="o-timeline-title" data-copy="headingTimeline"></h2>
      <div class="o-timeline__band" data-slot="timeline"></div>
    </section>

    <!-- O-9 Immer inklusive -->
    <section class="o-section o-included" aria-labelledby="o-included-title">
      <h2 class="t-offer-h2" id="o-included-title" data-copy="headingIncluded"></h2>
      <ul class="o-included__list t-ui" role="list" data-slot="included"></ul>
    </section>

    <!-- O-10 So geht es weiter -->
    <section class="o-section o-next" aria-labelledby="o-next-title">
      <h2 class="t-offer-h2" id="o-next-title">So geht es weiter</h2>
      <ol class="o-next__steps" data-slot="steps"></ol>
      <div class="o-next__cta">
        <a class="btn btn--primary" data-cta="mail" href="#"><span data-copy="ctaMail"></span></a>
        <a class="btn btn--outline" data-cta="wa" href="#" target="_blank" rel="noopener" hidden><span data-copy="ctaWhatsapp"></span></a>
        <button type="button" class="link t-small" data-action="copy-config">Konfiguration kopieren</button>
        <button type="button" class="link t-small" data-action="copy-link">Link zu dieser Konfiguration</button>
      </div>
      <p class="t-note o-copystatus" data-slot="copy-status" aria-live="polite"></p>
      <p class="t-small tone-80" data-copy="ctaNote"></p>
      <p class="t-small tone-64" data-slot="validity"></p>
    </section>

    <!-- O-11 Quellen: every market source once (the band lines link here) -->
    <section class="o-section o-sources" id="quellen" aria-labelledby="o-sources-title">
      <h2 class="t-h3 o-sources__title" id="o-sources-title" data-copy="headingSources"></h2>
      <p class="t-small tone-64 o-sources__intro" data-copy="sourcesIntro"></p>
      <ol class="o-sources__list" role="list" data-slot="sources"></ol>
    </section>
  </main>

  <!-- O-F footer -->
  <footer class="o-foot t-note">
    <p data-slot="foot-contact"></p>
    <p data-slot="foot-offer"></p>
    <p data-slot="foot-regular"></p>
    <p data-copy="notContract"></p>
  </footer>

</body>
</html>
